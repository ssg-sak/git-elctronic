# 로컬 개발용 인프라
# 사용법: docker compose up -d
# 비밀번호는 루트 .env 의 POSTGRES_PASSWORD (커밋 금지). 미설정 시 changeme.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ev-safecharge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ev_safecharge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/data-pipeline/processing/sql/init_status_test_schema.sql:/docker-entrypoint-initdb.d/01_status_test.sql:ro

  # 앱 서비스는 Dockerfile 작성 후 주석 해제 (infra/docker/ 참고)
  # api:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/api.Dockerfile
  #   ports:
  #     - "4000:4000"
  #   env_file: apps/api/.env
  #   depends_on:
  #     - db
  #
  # web:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/web.Dockerfile
  #   ports:
  #     - "3000:3000"
